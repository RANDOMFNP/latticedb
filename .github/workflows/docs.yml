name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'scripts/mdbook_seo.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: docs
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so scripts/mdbook_seo.py can read a real
          # last-modified date per page for the sitemap.
          fetch-depth: 0

      - name: Install mdBook
        run: |
          MDBOOK_VERSION="0.4.40"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Build book
        working-directory: book
        run: mdbook build

      - name: Post-process for search engines
        run: |
          python3 scripts/mdbook_seo.py \
            --build-dir book/build \
            --src-dir book/src \
            --base-url https://docs.latticedb.org

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy book/build --project-name=latticedb-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
