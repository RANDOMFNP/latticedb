<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- graph motif, right side -->
  <g opacity="0.9">
    <g stroke="#d8e4f2" stroke-width="2" fill="none">
      <line x1="948" y1="196" x2="1046" y2="292"/>
      <line x1="1046" y1="292" x2="960" y2="404"/>
      <line x1="948" y1="196" x2="960" y2="404"/>
      <line x1="1046" y1="292" x2="1128" y2="192"/>
      <line x1="960" y1="404" x2="1080" y2="452"/>
      <line x1="948" y1="196" x2="866" y2="300"/>
      <line x1="866" y1="300" x2="960" y2="404"/>
    </g>
    <circle cx="948"  cy="196" r="15" fill="#4a90d9"/>
    <circle cx="1046" cy="292" r="22" fill="#4a90d9"/>
    <circle cx="960"  cy="404" r="15" fill="#4a90d9"/>
    <circle cx="1128" cy="192" r="9"  fill="#a9c9ea"/>
    <circle cx="1080" cy="452" r="9"  fill="#a9c9ea"/>
    <circle cx="866"  cy="300" r="9"  fill="#a9c9ea"/>
  </g>

  <!-- wordmark -->
  <text x="88" y="188" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#1a1a1a">Lattice<tspan fill="#4a90d9">DB</tspan></text>

  <!-- headline -->
  <text x="88" y="300" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#1a1a1a">Embedded property-graph</text>
  <text x="88" y="368" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#1a1a1a">database. One file.</text>

  <!-- subhead -->
  <text x="88" y="432" font-size="27" fill="#5a6472">Vector similarity, BM25 full-text search, and graph</text>
  <text x="88" y="470" font-size="27" fill="#5a6472">traversal in a single Cypher query.</text>

  <!-- rule + footer -->
  <rect x="88" y="524" width="1024" height="1" fill="#e8e8e8"/>
  <text x="88" y="570" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a94a2">latticedb.org</text>
  <text x="1112" y="570" font-size="23" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8a94a2">MIT &#183; Zig &#183; no dependencies</text>
</svg>
